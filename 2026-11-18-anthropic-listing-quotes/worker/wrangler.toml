# Backup recorder for Binance's Anthropic quotes (GitHub's machines get HTTP 451). A Durable Object,
# placed in Asia-Pacific, reads Binance once a minute on its own alarm (the account's cron triggers are
# all in use) into a private D1 database. The only URL, /start, arms the alarm if it is not running;
# no URL serves the data (third-party API data is not published). Stops after 2026-11-21.
name = "anthropic-binance-quotes"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RECORDER"
class_name = "Recorder"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Recorder"]

[[d1_databases]]
binding = "DB"
database_name = "anthropic-binance-quotes"
database_id = "b786e639-9868-4f05-bba9-4b2811ca48c5"
