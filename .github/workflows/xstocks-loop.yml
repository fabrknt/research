# One turn of the xStocks loop (2026-11-22-xstocks-depth/loop/) every 6 hours: Claude Code reads the hourly
# medians the recorder writes (release xstocks-loop; no quotes, routes or books, and the raw recordings stay
# encrypted to a key kept off GitHub), tests one question, and writes a note under loop/.
#
# The turn runs scripts it writes, and steps of one job share the machine (GITHUB_PATH, GITHUB_ENV, files),
# so it gets a job of its own with a read-only token. Its new and changed files leave that job only as an
# artifact. A second job, with the write token, never runs anything from it: it checks the files (regular
# files, allowed names and kinds, size and count limits) and commits them.
# Needs the secret ANTHROPIC_API_KEY; a turn stops at $1.50 of API use. XSTOCKS_LOOP_STOP=1 stops it.
name: xstocks-loop

on:
  schedule:
    - cron: "50 */6 * * *"
  workflow_dispatch:

concurrency:
  group: xstocks-loop
  cancel-in-progress: false

jobs:
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Stop when asked or without a key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "${{ vars.XSTOCKS_LOOP_STOP }}" = "1" ]; then echo "XSTOCKS_LOOP_STOP is set"; exit 1; fi
          if [ "$HAS_KEY" != "true" ]; then echo "no ANTHROPIC_API_KEY secret"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          L=2026-11-22-xstocks-depth/loop d=$RUNNER_TEMP/xsl; mkdir -p "$d"
          for c in a b; do
            gh release download xstocks-loop -R "${{ github.repository }}" -p "summary.$c.jsonl" -O "$d/$c" 2>/dev/null || rm -f "$d/$c"
            if [ -f "$d/$c" ] && ! python3 -I -c 'import json,sys; [json.loads(l) for l in open(sys.argv[1])]' "$d/$c"; then rm -f "$d/$c"; fi
          done
          best=$(for c in a b; do if [ -f "$d/$c" ]; then echo "$(wc -l < "$d/$c") $c"; fi; done | sort -n | tail -1 | cut -d' ' -f2)
          [ -n "$best" ] || { echo "no summary copy"; exit 1; }
          cp "$d/$best" "$L/loop.summary.jsonl"
          python3 -I "$L/table.py" "$L/loop.summary.jsonl" | head -1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: One turn
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.323
          cd 2026-11-22-xstocks-depth/loop
          mkdir -p experiments
          # It may write only inside loop/ and run any python3 -I: a script it writes can do anything python
          # can, which is why this job holds no write token.
          claude -p "$(cat prompt.md)" \
            --model claude-sonnet-5-5 \
            --max-budget-usd 1.50 \
            --allowedTools "Read" "Glob" "Grep" "Write(./**)" "Edit(./**)" "Bash(python3 -I *)" \
            --output-format text
      - name: Hand over what changed
        run: |
          L=2026-11-22-xstocks-depth/loop o=$RUNNER_TEMP/handover; mkdir -p "$o"
          rm -f "$L/loop.summary.jsonl"
          # new or changed regular files under loop/; the commit job checks them again and decides
          git status --porcelain=v1 --untracked-files=all -- "$L" | cut -c4- |
            while IFS= read -r f; do if [ -f "$f" ] && [ ! -L "$f" ]; then cp --parents -- "$f" "$o/"; fi; done
          find "$o" -type f | head -50
      - uses: actions/upload-artifact@v4
        with:
          name: turn
          path: ${{ runner.temp }}/handover/
          retention-days: 7
          if-no-files-found: ignore

  commit:
    needs: turn
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true   # no artifact: the turn wrote nothing
        with:
          name: turn
          path: ${{ runner.temp }}/in
      # Nothing from the turn is run here: its files are only checked and copied.
      - name: Check the files
        run: python3 -I .github/xstocks_loop_take.py "$RUNNER_TEMP/in" 2026-11-22-xstocks-depth/loop
      - name: Commit
        run: |
          git add 2026-11-22-xstocks-depth/loop
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git diff --cached --stat
          git -c user.name=xstocks-loop -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "xstocks-loop: turn $(date -u +%Y-%m-%dT%H)"
          git pull -q --rebase && git push -q
