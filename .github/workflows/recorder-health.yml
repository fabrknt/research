# Once a day, recorder/health.py checks from each hour's count.json that every recorder source kept up over
# the last 24 hours, and comments on the open issue "recorder: gaps" (or opens it) when one didn't.
name: recorder-health

on:
  schedule:
    - cron: "40 23 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I recorder/health.py
