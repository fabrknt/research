# Collects 2026-11-16-one-quote-vs-books on GitHub's machines, so a laptop going to sleep doesn't stop it.
# Every hour a job saves a round every 5 minutes (12 rounds). Jobs queue one behind the other, so a late
# start only shifts the next hour.
#
# The snapshots are third-party API data, which this repo does not publish (see the README). Each hour's
# are encrypted to .github/one-quote-data.pub.pem (AES-256 with a random key, the key wrapped with RSA-OAEP)
# and kept as a workflow artifact; only the holder of the private key, kept off GitHub, can read them.
name: one-quote-collect

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "rounds to collect, 5 minutes apart"
        default: "12"

concurrency:
  group: one-quote-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Stop after the study window
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261126 ]; then echo "window over"; exit 1; fi
      - uses: actions/checkout@v4
      - name: Collect
        working-directory: 2026-11-16-one-quote-vs-books
        run: python3 -I collect.py "${{ inputs.rounds || '12' }}" 300
      - name: Encrypt
        working-directory: 2026-11-16-one-quote-vs-books
        run: |
          mkdir -p ../out
          tar czf data.tgz data
          openssl rand -out key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in data.tgz -out ../out/data.tgz.enc -pass file:key.bin
          openssl pkeyutl -encrypt -pubin -inkey ../.github/one-quote-data.pub.pem \
            -pkeyopt rsa_padding_mode:oaep -in key.bin -out ../out/key.bin.enc
          rm -f key.bin data.tgz
          ls -l ../out
      - uses: actions/upload-artifact@v4
        with:
          name: one-quote-${{ github.run_id }}
          path: out/
          retention-days: 90
