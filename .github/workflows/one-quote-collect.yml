# Collects 2026-11-16-one-quote-vs-books on GitHub's machines, so a laptop going to sleep doesn't stop it.
# A job saves a round every 5 minutes for an hour (12 rounds), then starts the next job itself: GitHub's
# hourly schedule fired once in the first ten hours (2026-11-16), so it is only the backup. Jobs queue one
# behind the other.
#
# The snapshots are third-party API data, which this repo does not publish (see the README). Each hour's
# are encrypted to .github/one-quote-data.pub.pem (AES-256 with a random key, the key wrapped with RSA-OAEP)
# and kept as a workflow artifact; only the holder of the private key, kept off GitHub, can read them.
name: one-quote-collect

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "rounds to collect, 5 minutes apart"
        default: "12"

concurrency:
  group: one-quote-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      actions: write   # to start the next hour
    steps:
      - name: Stop after the study window
        id: window
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261126 ]; then echo "window over"; exit 1; fi
      # From here on the next hour starts even if this one fails: a 429 at start-up broke the chain
      # for 5.5 hours on 2026-11-17.
      - uses: actions/checkout@v4
      - name: Collect
        id: collect
        working-directory: 2026-11-16-one-quote-vs-books
        continue-on-error: true
        run: python3 -I collect.py "${{ inputs.rounds || '12' }}" 300
      - name: Encrypt
        if: always() && hashFiles('2026-11-16-one-quote-vs-books/data/snap-*.jsonl') != ''
        working-directory: 2026-11-16-one-quote-vs-books
        run: |
          mkdir -p ../out
          tar czf data.tgz data
          openssl rand -out key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in data.tgz -out ../out/data.tgz.enc -pass file:key.bin
          openssl pkeyutl -encrypt -pubin -inkey ../.github/one-quote-data.pub.pem \
            -pkeyopt rsa_padding_mode:oaep -in key.bin -out ../out/key.bin.enc
          rm -f key.bin data.tgz
          ls -l ../out
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('out/data.tgz.enc') != ''
        with:
          name: one-quote-${{ github.run_id }}
          path: out/
          retention-days: 90
      - name: Back off after a failed hour
        if: always() && steps.collect.outcome == 'failure'
        run: sleep 300
      - name: Start the next hour
        if: always() && steps.window.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run one-quote-collect -R "${{ github.repository }}" --ref main
