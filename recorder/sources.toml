# What the recorder keeps. One [[source]] per thing recorded: the module in sources/ that fetches it,
# how often (seconds), and the question it is kept for. Add a source only when that line can be written.

[[source]]
name = "hl_ctx"
module = "hl_ctx"
every = 60
why = "Hyperliquid's mark, oracle, mid, funding and open interest on the main dex and every HIP-3 dex: the API keeps no history of open interest or oracle prices, and candles reach back only 5,000 bars."

[[source]]
name = "one_quote"
module = "one_quote"
every = 300
why = "Variational's dealer quotes (whole listing rows: funding, open interest, volume) next to the Lighter and Hyperliquid books for the same markets at the same moment. Variational keeps no public history of its quotes."

[[source]]
name = "lighter_blobs"
module = "lighter_blobs"
every = 600
why = "Every Lighter batch blob, so Lighter's state can be rebuilt without its API: Ethereum drops blobs after about 18 days, and older ones are readable today only through Blobscan."

[[source]]
name = "rules"
module = "rules"
every = 86400
why = "Each venue's rules as they stood that day (Hyperliquid dex settings and margin tables, Lighter market settings, the Hyperliquid, Lighter and Variational docs), to explain later what the rules were when something happened."

[[source]]
name = "solana_quotes"
module = "solana_quotes"
every = 60
why = "What each Solana prop AMM would pay for SOL/USDC at three sizes each way, minute by minute: their quotes are in no order book and Solana keeps no past account state to simulate them against later."

[[source]]
name = "events"
module = "events"
every = 10
why = "The Hyperliquid and Lighter books every 10-30 s for 72 h after a name moves 1.5% from its last-minute high or low or first lists: what everyone wants later is the book around such moments, and no one sells it across venues at the same instant."

[[source]]
name = "xstocks_quotes"
module = "xstocks_quotes"
every = 300
why = "What Solana's tokenized US shares (xStocks) cost to buy and sell at $1k, $10k and $100k on Jupiter, and which venues fill them, next to the Hyperliquid xyz perp book for the same share at the same moment, weekends included: neither side keeps a history of quotes at size, and the gap between them out of market hours shows only while it lasts."

[[source]]
name = "listing_watch"
module = "listing_watch"
every = 300
why = "The moment a labelled Wintermute wallet first receives a token BitGo added in the last 30 days (Ethereum, Base, Arbitrum, Robinhood Chain): in past Robinhood listings this came hours before the listing, and transfers into a wallet are easy to miss live and dull to rebuild later."

[[source]]
name = "evm_stock_quotes"
module = "evm_stock_quotes"
every = 1800
why = "What the same tokenized US shares cost to round-trip at $10k and $100k on BNB Chain, Ethereum, Arbitrum, Robinhood Chain and Monad, per issuer (xStocks, bStocks, Ondo, Robinhood), through KyberSwap's routes, in and out of US hours: which chain and issuer has size is what decides where a stock prop AMM should quote, and aggregator quotes keep no history."
